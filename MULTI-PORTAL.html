<style>
body {

 <!-- VISTA DE NAVEGADOR (Iframe) -->

            <button type="button" onclick="goHome()" class="p-2 bg-[#121927] hover:bg-[#1a2334] rounded-lg text-amber-100/70 transition outline-none">

            </button>
            
            <form class="flex-1 flex gap-2 relative" onsubmit="handleBrowserSearch(event)">

    <!-- MODAL DE ALERTA (CineCalidad RS) -->
    <div id="alert-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-panel border border-orange-500/20 rounded-2xl w-full max-w-[340px] p-6 shadow-[0_0_50px_rgba(0,0,0,0.8)] relative flex flex-col items-center">
       <!-- Botón Cerrar -->
            <button type="button" onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

       <!-- Título -->
            <div class="flex items-center gap-2 mb-5 mt-2 w-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange-500 shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                <h2 class="font-luckiest text-amber-300 text-[1.3rem] tracking-wide mt-1">REPRODUCTOR MEGA</h2>
            </div>

      <!-- Contenido (NUEVO: Ajuste de espaciado y visibilidad) -->
            <p id="P" class="text-[#d1d5db] text-center text-base leading-relaxed mb-6 w-full px-2">
                El contenido de <span class="text-[#fde68a] font-bold">Cine Calidad</span> solo se<br>
                reproducirá en el reproductor de <span class="text-[#fde68a] font-bold">MEGA</span>.
            </p>

    <!-- Botones de Acción -->
            <div class="flex flex-col gap-3 w-full">
                <button type="button" onclick="confirmModal()" class="w-full bg-[#f97316] hover:bg-[#ea580c] text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 transition shadow-lg outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
                    Continuar
                </button>
                <button type="button" onclick="closeModal()" class="w-full bg-transparent border border-gray-700 text-gray-300 hover:bg-gray-800 font-semibold py-3 rounded-xl transition outline-none">
                    Cancelar
                </button>
            </div>

<script>
        // Configuración de sitios
        const sites = {
            pelisflix: { 
                name: 'Pelisflix', 
                url: 'https://pelisflix1.link/', 
                searchUrl: 'https://pelisflix1.link/search?s=', 
                embeddable: true 
            },
            gnula: { 
                name: 'Gnula', 
                url: 'https://ww3.gnulahd.nu/', 
                searchUrl: 'https://ww3.gnulahd.nu/?s=', 
                embeddable: false 
            }, 
            cinecalidad_rs: { 
                name: 'Cine Calidad', 
                url: 'https://www.cinecalidad.rs/', 
                searchUrl: 'https://www.cinecalidad.rs/?s=', 
                embeddable: true 
            },
            pelispedia: { 
                name: 'Pelispedia', 
                url: 'https://pelispedia.mov/', 
                searchUrl: 'https://pelispedia.mov/search?s=', 
                embeddable: false 
            },
            sololatino: { 
                name: 'Sololatino', 
                url: 'https://lamovie.github.io/SeeKee/PLATAFORMAS.html', 
                searchUrl: 'https://sololatino.net/buscar?q=', 
                embeddable: false 
            },  
            entrepelisyseries: { 
                name: 'Entrepelisyseries', 
                url: 'https://entrepeliculasyseries.nz/', 
                searchUrl: 'https://entrepeliculasyseries.nz/search?s=', 
                embeddable: false 
            },  
            pelisplus: { 
                name: 'Pelis Plus', 
                url: 'https://www.pelisplushd.la/', 
                searchUrl: 'https://www.pelisplushd.la/search?s=',
                embeddable: false 
            },
            cinecalidad_pro: { 
                name: 'Cinecalidad', 
                url: 'https://ww2.cinecalidad.pro/', 
                searchUrl: 'https://ww2.cinecalidad.pro/?s=',
                embeddable: false 
            },   
            pelis28: { 
                name: 'Pelis28', 
                url: 'https://ver.pelis28.net/', 
                searchUrl: 'https://ver.pelis28.net/?s=', 
                embeddable: false 
            },
            poseidonhd2: { 
                name: 'Poseidonhd2', 
                url: 'https://www.poseidonhd2.co/', 
                searchUrl: 'https://www.poseidonhd2.co/search?q=', 
                embeddable: false 
            }
        };

        let currentSiteKey = null;
        let pendingAction = null; 

        // Abrir un sitio desde los iconos
        function openSite(key) {
            const site = sites[key];
            
            // Webs no embedables van directo a nueva pestaña
            if (!site.embeddable) {
                window.open(site.url, '_blank');
                return;
            }

            // Excepción de alerta para cinecalidad.rs
            if (key === 'cinecalidad_rs') {
                pendingAction = { type: 'nav', key };
                showModal();
            } else {
                loadInBrowser(key, site.url);
            }
        }

        // Búsqueda desde la pantalla principal
        function handleMainSearch(e) {
            e.preventDefault();
            const input = document.getElementById('main-search-input');
            const query = input.value.trim();
            
            if (!query) return;

            // Seleccionar aleatoriamente una web de TODAS las disponibles
            const allKeys = Object.keys(sites);
            const randomKey = allKeys[Math.floor(Math.random() * allKeys.length)];
            const site = sites[randomKey];
            
            if (site.embeddable) {
                if (randomKey === 'cinecalidad_rs') {
                    pendingAction = { type: 'search', key: randomKey, query };
                    showModal();
                } else {
                    loadInBrowser(randomKey, site.searchUrl + encodeURIComponent(query));
                }
            } else {
                // Abrir en nueva pestaña si no es embeddable
                window.open(site.searchUrl + encodeURIComponent(query), '_blank');
            }
            
            input.value = ''; 
        }

        // Búsqueda dentro de la vista de navegador
        function handleBrowserSearch(e) {
            e.preventDefault();
            if (!currentSiteKey) return;
            
            const input = document.getElementById('browser-search-input');
            const query = input.value.trim();
            if (!query) return;

            const site = sites[currentSiteKey];
            const iframe = document.getElementById('browser-iframe');
            iframe.src = site.searchUrl + encodeURIComponent(query);
            input.blur();
        }

        // Cargar iframe
        function loadInBrowser(key, url) {
            currentSiteKey = key;
            const site = sites[key];
            
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('browser-view').classList.remove('hidden');
            document.getElementById('browser-view').classList.add('flex');
            
            document.getElementById('browser-search-input').placeholder = `BUSCAR EN ${site.name.toUpperCase()}...`;
            document.getElementById('browser-search-input').value = '';
            document.getElementById('browser-iframe').src = url;
        }

        // Volver a inicio
        function goHome() {
            document.getElementById('browser-view').classList.add('hidden');
            document.getElementById('browser-view').classList.remove('flex');
            document.getElementById('main-view').classList.remove('hidden');
            document.getElementById('browser-iframe').src = 'about:blank'; // Limpia el iframe
            currentSiteKey = null;
        }

        // Refrescar iframe
        function refreshIframe() {
            const iframe = document.getElementById('browser-iframe');
            const currentSrc = iframe.src;
            iframe.src = 'about:blank';
            setTimeout(() => { iframe.src = currentSrc; }, 50);
        }

        // Funciones del Modal
        function showModal() {
            document.getElementById('alert-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('alert-modal').classList.add('hidden');
            pendingAction = null;
        }

        function confirmModal() {
            document.getElementById('alert-modal').classList.add('hidden');
            if (pendingAction) {
                if (pendingAction.type === 'nav') {
                    loadInBrowser(pendingAction.key, sites[pendingAction.key].url);
                } else if (pendingAction.type === 'search') {
                    loadInBrowser(pendingAction.key, sites[pendingAction.key].searchUrl + encodeURIComponent(pendingAction.query));
                }
                pendingAction = null;
            }
        }
        
window.addEventListener('DOMContentLoaded', () => {
            var Int = document.querySelector('#main-search-input');
            var params = new URLSearchParams(window.location.search);
            var textCapt = params.get('texto');

        if (textCapt) {
     Int.value = textCapt;
   }
});
</script>
</body>
</html>
