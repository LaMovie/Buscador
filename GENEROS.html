#Lista {

}
#Lista li {
    position: relative;
    width: 100%;
    height: 140px;
    display: flex;

    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
#Lista li::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #00f0ff, #7f05ff, #ff007f);
}
#Lista li::after {
    content: '▶';
    position: absolute;
    font-size: 45px;
    color: rgba(255, 255, 255, 0.04);
    bottom: -5px;

}
#Lista li a {

}
#Lista li:hover {

#L {

}
@keyframes L {
    from { opacity: 1;}

}
@media (min-width: 768px) {
    #Lista {
        grid-template-columns: repeat(5, 1fr);

    }
}

<script>
// 1. MANEJO DEL BUSCADOR Y LOGO
var SEARCH = document.querySelectorAll('#Search, #Logo');
SEARCH.forEach(S => {
    S.onclick = () => {
        var I = document.getElementById("I");
        var Logo = document.getElementById("Logo");
        if (I.value === '') {
            if (I.style.display === 'block') {
                I.style.display = 'none';
                Logo.style.display = 'block';
            } else {
                I.style.display = 'block';
                Logo.style.display = 'none';
            }   
        } else {
            Check();
        } 
        I.focus();
    };
});

// 2. FUNCIONES DE BÚSQUEDA EXTERNA Y FILTRADO
function abrirFuera(urlDestino) {
    var urlSinProtocolo = urlDestino.replace("https://", "");
    var intentURL = "intent://" + urlSinProtocolo + "#Intent;scheme=https;action=android.intent.action.VIEW;end;";
    window.location.href = intentURL;
}

function Check() {
    var I = document.getElementById("I");
    var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    var domain = isMobile ? 'lamovie.github.io/SeeKee/PLATAFORMAS.html' : 'https://www.google.com/search?q=site:sololatino.net+' + I.value;
    abrirFuera(domain);
    I.value = "";
}

function FiltrarLista() {
    var I = document.getElementById("I");
    var query = I.value.toLowerCase().trim();
    var items = document.querySelectorAll('#Lista li');
       
    if (query !== "") {
        var destino = document.querySelector('#H');
        if (destino) {
            var posicionY = destino.getBoundingClientRect().top + window.scrollY;
            window.scroll({top: posicionY - 20, behavior: 'smooth'});
        }
    }
      
    items.forEach(li => {
        var texto = li.textContent.toLowerCase();
        li.style.display = texto.includes(query) ? 'flex' : 'none';
    });
}

function AccionEnter() {
    var I = document.getElementById("I");
    var query = I.value.toLowerCase().trim();
    var items = document.querySelectorAll('#Lista li');
    var coincidencia = null;

    if (query !== "") {
        items.forEach(li => {
            var texto = li.textContent.toLowerCase();
            if (!coincidencia && li.style.display !== 'none' && texto.includes(query)) {
                coincidencia = li;
            }
        });
    }

    if (coincidencia) {
        coincidencia.click();
        I.value = '';
    } else {
        Check();
        I.value = '';
    }
}

// 3. CONFIGURACIÓN DE GÉNEROS Y COLORES
const GENEROS_DISPONIBLES = ['ACCION', 'ANIME', 'COMEDY', 'FICCION', 'SERIES', 'TERROR'];

const COLORES_GENERO = {
    ACCION:  { normal: '#ff5722', hover: '#ff9100', glow: 'rgba(255, 87, 34, 0.45)', color: '#ff5722' },
    ANIME:   { normal: '#00f0ff', hover: '#4fffb0', glow: 'rgba(0, 240, 255, 0.45)', color: '#00f0ff' },
    COMEDY:  { normal: '#ffd600', hover: '#ffff72', glow: 'rgba(255, 214, 0, 0.45)', color: '#ffd600' },
    FICCION: { normal: '#b388ff', hover: '#ea80fc', glow: 'rgba(179, 136, 255, 0.45)', color: '#b388ff' },
    SERIES:  { normal: '#ff4bb9', hover: '#4f9',    glow: 'rgba(255, 75, 185, 0.45)', color: '#ff4bb9' },
    TERROR:  { normal: '#ff1744', hover: '#ff8a80', glow: 'rgba(255, 23, 68, 0.5)', color: '#4f3' }
};

const urlParams = new URLSearchParams(window.location.search);
let generoActivo = null;

for (const [key, val] of urlParams.entries()) {
    const k = key.trim().toUpperCase();
    const v = val.trim().toUpperCase();
    if (GENEROS_DISPONIBLES.includes(k)) { generoActivo = k; break; }
    if (GENEROS_DISPONIBLES.includes(v)) { generoActivo = v; break; }
}

function cargarScript(src, callback) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = callback;
    s.onerror = () => console.warn('No se pudo cargar:', src);
    document.head.appendChild(s);
}

// 4. CARGA DE LISTAS, CLASIFICACIÓN Y REDIRECCIÓN INTELIGENTE
function renderizarCatalogo(datosCrudos, generoActual) {
    var esModoSerie = urlParams.has('serie') || generoActual === 'SERIES';

    var SERE_KEYWORDS = ['folders', 'drama', 'publicfoldergrid'];
    var FILM_KEYWORDS = ['file', 'movie', 'vidyard.com', 'dropbox', '.m3u8', 'gallery=open', '.mp4'];
    var PLAY2_DOMAINS = ['dropbox', 'play.vidyard', 'google.com/file', '.m3u8', '.mp4'];

    var PELIS = [...datosCrudos].reverse();
    
    var Lista = document.getElementById("Lista");
    var H = document.getElementById("H");
    var L = document.getElementById("L");

    Lista.innerHTML = '';

    const temaGenero = generoActual ? COLORES_GENERO[generoActual] : null;
    var colorPorDefecto = temaGenero ? temaGenero.normal : (esModoSerie ? '#ff4bb9' : '#4f7');
    var colorActivo     = temaGenero ? temaGenero.hover  : (esModoSerie ? '#4f9' : '#7F05FF');

    if (generoActual) {
        if (esModoSerie) Lista.classList.add('modo-serie');
        H.textContent = `🔥 ${generoActual} 🔥`;
        H.style.color = temaGenero.color;
        H.style.textShadow = `0px 0px 10px ${temaGenero.normal}, 0px 0px 22px #000`;
        L.textContent = "-> PELÍCULAS <-";
        L.style.color = "#00f0ff";
    } else if (esModoSerie) {
        Lista.classList.add('modo-serie');
        H.textContent = "🧋 SERIES 🧋";
        L.textContent = "-> PELICULAS <-";
        L.style.color = "#4f9";
    } else {
        H.textContent = "🍿 PELÍCULAS 🍿";
        L.textContent = "-> SERIES <-";
        L.style.color = "#f09";
    }

    PELIS.forEach(item => {
        let NN = item.NAME || item.name || '';
        let URL = item.URL || item.url || '';
        if (!URL) return;

        let esSerie = !!(item.CAPS || item.caps || NN.includes('🧋') || SERE_KEYWORDS.some(s => URL.includes(s)));
        let debeMostrar = generoActual
            ? true
            : (esModoSerie ? esSerie : (!esSerie && FILM_KEYWORDS.some(f => URL.includes(f))));

        if (debeMostrar) {
            let li = document.createElement('li');
            li.innerHTML = `<a class="Data" href="${URL}" data-serie="${esSerie}" data-nombre="${NN}" style="color: ${colorPorDefecto};">${NN}</a>`;
            if (temaGenero) {
                li.style.borderColor = temaGenero.normal;
                li.onmouseenter = () => {
                    li.style.boxShadow = `0 10px 25px ${temaGenero.glow}`;
                    const link = li.querySelector('a');
                    if (link) link.style.color = temaGenero.hover;
                };
                li.onmouseleave = () => {
                    li.style.boxShadow = '0 6px 15px rgba(0, 0, 0, 0.7)';
                    const link = li.querySelector('a');
                    if (link) link.style.color = colorPorDefecto;
                };
            }
            Lista.appendChild(li);
        }
    });

    // CLICK EN CADA ELEMENTO DE LA LISTA
    var LIST = document.querySelectorAll('#Lista li');
    LIST.forEach(lis => {
        lis.onclick = (e) => {
            e.preventDefault();
            
            LIST.forEach(other => {
                other.style.border = '';
                other.style.background = '#001';
                if (temaGenero) other.style.borderColor = temaGenero.normal;
                let otherA = other.querySelector('a');
                if (otherA) otherA.style.color = colorPorDefecto; 
            });

            lis.style.background = '#000';
            lis.style.borderTop = '1px solid blue';
            lis.style.borderBottom = '.1px solid #4f3';        
            
            let activeA = lis.querySelector('a');
            if (activeA) activeA.style.color = colorActivo;

            var Enlace = activeA ? activeA.href : e.target.href;
            var NombreOriginal = activeA ? activeA.getAttribute('data-nombre') : lis.textContent;
            var esSerieLink = activeA ? (activeA.getAttribute('data-serie') === 'true') : false;

            var LIMPIO = NombreOriginal.replace(/🍿|🌐|📺|⚙️|🧋/g, '').trim();
            H.textContent = NombreOriginal;

            var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
     
            setTimeout(() => {
                H.textContent = '⏳Espere...';

                if ((esSerieLink && Enlace.includes('dropbox')) || (esSerieLink && Enlace.includes('.mp4'))) {
                    window.location.href = `https://lamovie.github.io/La-Movie-Delux/PLAY2.html?titulo=${encodeURIComponent(LIMPIO)}&exacto=${encodeURIComponent(NombreOriginal)}`;
                } else if (esSerieLink || SERE_KEYWORDS.some(s => Enlace.includes(s))) {
                    if (!isMobile && Enlace.includes('latino.solo')) {
                        window.location.href = Enlace.replace('latino.solo-latino', 'h5.swplayer');
                    } else if (Enlace.includes('pelisflix')) {
                        window.location.href = `https://lamovie.github.io/La-Movie-Delux/AUX.html?titulo=🍿${LIMPIO}`;
                    } else {
                        window.location.href = Enlace;
                    }
                } else if (PLAY2_DOMAINS.some(mov => Enlace.includes(mov))) {
                    window.location.href = `https://lamovie.github.io/La-Movie-Delux/PLAY2.html?titulo=${encodeURIComponent(LIMPIO)}`;
                } else if (Enlace.includes('mp4')) {
                    window.location.href = `https://lamovie.github.io/La-Movie-Delux/PLAY2.html?titulo=${LIMPIO}`;        
                } else if (NombreOriginal.includes('🌐')) {
                    let NN_clean = NombreOriginal.replace('🌐', '').trim();
                    window.location.href = Enlace + '?texto=' + encodeURIComponent(NN_clean);
                } else if (!isMobile && Enlace.includes('latino.solo')) {
                    window.location.href = Enlace.replace('latino.solo-latino', 'h5.swplayer');
                } else {
                    window.location.href = Enlace;
                }
            }, 800);

            var I = document.getElementById("I");
            if (I) I.value = '';
        };
    });    
    
    var MODO = document.querySelectorAll('#H, #L');
    MODO.forEach(m => {
        m.onclick = () => {
            if (generoActual) {
                window.location.search = '?peli';
            } else {
                window.location.search = esModoSerie ? '?peli' : '?serie';
            }
        };
    });
}

window.addEventListener('DOMContentLoaded', () => {
    if (generoActivo) {
        cargarScript(`GENEROS/${generoActivo}.js`, () => {
            renderizarCatalogo(window[generoActivo] || [], generoActivo);
        });
    } else {
        let cargados = 0;
        const archivos = [
            atob('QnVzY2Fkb3IuanM='),
            atob('QnVzY2Fkb3IyLmpz'),
            atob('QnVzY2Fkb3IzLmpz')
        ];
        archivos.forEach(arch => {
            cargarScript(arch, () => {
                cargados++;
                if (cargados === archivos.length) {
                    const combinados = [
                        ...(window.Lista1 || []),
                        ...(window.Lista2 || []),
                        ...(window.Lista3 || [])
                    ];
                    renderizarCatalogo(combinados, null);
                }
            });
        });
    }
});

// 5. SCROLL
setTimeout(() => {
    var destino = document.querySelector('#H');
    if (destino) {
        var posicionY = destino.getBoundingClientRect().top + window.scrollY;
        window.scroll({ top: posicionY - 20, behavior: 'smooth' });        
    }
}, 800);

// 6. CARDS INICIALES
Oculto.onclick = (e) => {
    e.preventDefault();
    var Link = e.target.closest('a');        
    var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);  
    var URL = '';

    if (Link && isMobile) {
        URL = Link.href.replace('h5.swplayer', 'latino.solo-latino');
    } else if (Link && !isMobile) {
        URL = Link.href;
    }

    if (URL) {
        setTimeout(() => {
            window.location.href = URL;
        }, 500);
    }
};
</script>
