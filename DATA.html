#Lista li {
    position: relative;
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
    border-radius: 16px;
    
    /* Fondo con degradado elegante de plataforma streaming */
    background: linear-gradient(145deg, #0a0f1d, #02050b);
    border: 1px solid rgba(0, 240, 255, 0.25);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.7);
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

/* Línea superior neón tipo "Póster VIP" */
#Lista li::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #00f0ff, #7f05ff, #ff007f);
}

/* Marca de agua flotante de Play (▶) en el fondo de la tarjeta */
#Lista li::after {
    content: '▶';
    position: absolute;
    font-size: 45px;
    color: rgba(255, 255, 255, 0.04);
    bottom: -5px;
    right: 5px;
    pointer-events: none;
    transition: color 0.3s ease;
}

/* Texto del título ajustado y centrado */
#Lista li a {

}
#Lista li:hover {

    border-color: #00f0ff;
    background: linear-gradient(145deg, #121c33, #080e1a);
    box-shadow: 0 10px 25px rgba(0, 240, 255, 0.35);
}

#Lista li:hover::after {
    color: rgba(0, 240, 255, 0.15);
}

/* HOVER MODO PELIS (DEFAULT) */
#Lista li:hover a {

}

/* HOVER MODO SERIE */
#Lista.modo-serie li:hover a {

<script>
// 1. MANEJO DEL BUSCADOR Y LOGO
var SEARCH = document.querySelectorAll('#Search, #Logo');
SEARCH.forEach(S => {
    S.onclick = () => {
        var I = document.getElementById("I");
        var Logo = document.getElementById("Logo");
        if (I.value === '') {
 if (I.style.display === 'block') {
      I.style.display = 'none';
    Logo.style.display = 'block';
            } else {
   I.style.display = 'block';
    Logo.style.display = 'none';
            }   
        } else {
            Check();
        } 
        I.focus();
    }
});

// 2. FUNCIONES DE BÚSQUEDA EXTERNA Y FILTRADO
function abrirFuera(urlDestino) {
    var urlSinProtocolo = urlDestino.replace("https://", "");
    var intentURL = "intent://" + urlSinProtocolo + "#Intent;scheme=https;action=android.intent.action.VIEW;end;";
    window.location.href = intentURL;
}

     function Check() {
        var I = document.getElementById("I");
    var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    var domain = isMobile ? 'lamovie.github.io/SeeKee/PLATAFORMAS.html' : 'https://www.google.com/search?q=site:sololatino.net+' + I.value;
    abrirFuera(domain);
    I.value = "";
}

    function FiltrarLista() {
         var I = document.getElementById("I");
    var query = I.value.toLowerCase().trim();
    var items = document.querySelectorAll('#Lista li');
       
    if (query !== "") {
        var destino = document.querySelector('#H');
        if (destino) {
            var posicionY = destino.getBoundingClientRect().top + window.scrollY;
            window.scroll({top: posicionY - 20, behavior: 'smooth'});
        }
    }
      
    items.forEach(li => {
        var texto = li.textContent.toLowerCase();
   if (texto.includes(query)) {
   li.style.display = 'flex';
        } else {
   li.style.display = 'none';
        }
    });
}

    function AccionEnter() {
       var I = document.getElementById("I");
    var query = I.value.toLowerCase().trim();
    var items = document.querySelectorAll('#Lista li');
    var coincidencia = null;

    if (query !== "") {
        items.forEach(li => {
            var texto = li.textContent.toLowerCase();
            if (!coincidencia && li.style.display !== 'none' && texto.includes(query)) {
            coincidencia = li;
            }
        });
    }

    if (coincidencia) {
        coincidencia.click();
        I.value = '';
    } else {
        Check();
        I.value = '';
    }
}

// 3.🔑 CARGA DE LISTAS, CLASIFICACIÓN Y REDIRECCIÓN INTELIGENTE
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    var esModoSerie = params.has('serie');

    var SERE_KEYWORDS = ['folders', 'drama', 'publicfoldergrid'];
    var FILM_KEYWORDS = ['file', 'movie', 'vidyard.com', 'dropbox', '.m3u8', 'gallery=open'];
    var PLAY2_DOMAINS  = ['dropbox', 'play.vidyard', 'google.com/file', '.m3u8'];

    var PELIS = [...Lista1, ...Lista2, ...Lista3].reverse();
    
    var Lista = document.getElementById("Lista");
    var H = document.getElementById("H");

    var colorPorDefecto = esModoSerie ? '#ff4bb9' : '#4f7';
    var colorActivo     = esModoSerie ? '#4f9' : '#7F05FF';

    if (esModoSerie) {
        Lista.classList.add('modo-serie');
 H.textContent = "🧋 SERIES 🧋";
        } else {
 H.textContent = "🍿 PELÍCULAS 🍿";
    }

    PELIS.forEach(item => {
        let NN = item.NAME || item.name || '';
        let URL = item.URL || item.url || '';
        if (!URL) return;

        // 🔑 Si tiene CAPS o la palabra drama/folders/🧋, es Serie. Si no, es Película.
        let esSerie = !!(item.CAPS || item.caps || NN.includes('🧋') || SERE_KEYWORDS.some(s => URL.includes(s)));
        let debeMostrar = esModoSerie ? esSerie : (!esSerie && FILM_KEYWORDS.some(f => URL.includes(f)));

        if (debeMostrar) {
            let li = document.createElement('li');
            li.innerHTML = `<a class="Data" href="${URL}" data-serie="${esSerie}" data-nombre="${NN}" style="color: ${colorPorDefecto};">${NN}</a>`;
            Lista.appendChild(li);
        }
    });

    // CLICK EN CADA ELEMENTO DE LA LISTA
    var LIST = document.querySelectorAll('#Lista li');
    LIST.forEach(lis => {
        lis.onclick = (e) => {
            e.preventDefault();
            
       LIST.forEach(other => {
          other.style.border = '';
                other.style.background = '#001';
                let otherA = other.querySelector('a');
                if (otherA) otherA.style.color = colorPorDefecto; 
     });

     lis.style.background = '#000';
     lis.style.borderTop = '1px solid blue';
     lis.style.borderBottom = '.1px solid #4f3';        
            
            let activeA = lis.querySelector('a');
            if (activeA) activeA.style.color = colorActivo;

            var Enlace = activeA ? activeA.href : e.target.href;
            var NombreOriginal = activeA ? activeA.getAttribute('data-nombre') : lis.textContent;
            var esSerieLink = activeA ? (activeA.getAttribute('data-serie') === 'true') : false;

            var LIMPIO = NombreOriginal.replace(/🍿|🌐|📺|⚙️|🧋/g, '').trim();
            H.textContent = NombreOriginal;

     var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
     
         setTimeout(() => {
  H.textContent = '⏳Espere...';

                if (esSerieLink && Enlace.includes('dropbox')) {
                    // SERIE DE DROPBOX -> Pasa &exacto= para mantener capitulos y emojis
                    window.location.href = `https://lamovie.github.io/La-Movie-Delux/PLAY2.html?titulo=${encodeURIComponent(LIMPIO)}&url=${encodeURIComponent(Enlace)}&exacto=${encodeURIComponent(NombreOriginal)}`;
                } else if (esSerieLink || SERE_KEYWORDS.some(s => Enlace.includes(s))) {
                    // OTRAS SERIES
                    window.location.href = Enlace;
      
      if (!isMobile && Enlace.includes('latino.solo')) {
   window.location.href = Enlace.replace('latino.solo-latino', 'h5.swplayer');
      }              
         if (Enlace.includes('pelisflix')) {
 window.location.href = `https://lamovie.github.io/La-Movie-Delux/AUX.html?titulo=🍿${LIMPIO}&url=${Enlace}`;
      }   
                } else if (PLAY2_DOMAINS.some(mov => Enlace.includes(mov))) {
          // PELÍCULAS
                    window.location.href = `https://lamovie.github.io/La-Movie-Delux/PLAY2.html?titulo=${encodeURIComponent(LIMPIO)}&url=${encodeURIComponent(Enlace)}`;
                } else if (NombreOriginal.includes('🌐')) {
                    let NN_clean = NombreOriginal.replace('🌐', '').trim();
                    window.location.href = Enlace + '?texto=' + encodeURIComponent(NN_clean);
                } else if (!isMobile && Enlace.includes('latino.solo')) {
                    window.location.href = Enlace.replace('latino.solo-latino', 'h5.swplayer');
                } else {
                    window.location.href = Enlace;
                }
            }, 800);

            var I = document.getElementById("I");
            if (I) I.value = '';
        };
    });    
    
    H.onclick = () => {
        window.location.search = esModoSerie ? '?peli' : '?serie';
    }
}); 

// 4. SCROLL
setTimeout(() => {
    var destino = document.querySelector('#H');
    if (destino) {
        var posicionY = destino.getBoundingClientRect().top + window.scrollY;
        window.scroll({ top: posicionY - 20, behavior: 'smooth' });        
    }
}, 800);
</script>
