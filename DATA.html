<script>
// Función maestra que fuerza el menú de aplicaciones de Android

  function abrirFuera(urlDestino) {
      // Le quitamos el https:// a la URL para armar el Intent
      
      var urlSinProtocolo = urlDestino.replace("https://", "");
      
    var intentURL = "intent://" + urlSinProtocolo + "#Intent;scheme=https;action=android.intent.action.VIEW;end;";
      
  window.location.href = intentURL;
    }

       function Check() {
      isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  
  var domain = isMobile ? 'lamovie.github.io/SeeKee/PLATAFORMAS.html' : 'https://www.google.com/search?q=site:sololatino.net+' + I.value;
    
      abrirFuera(domain);
          I.value = "";
    }

// FILTRA VISUALMENTE Y HACE SCROLL HACIA #H SOLO CUANDO EL INPUT NO ESTÁ VACÍO
       function FiltrarLista() {
      var query = I.value.toLowerCase().trim();
      var items = document.querySelectorAll('#Lista li');
      
      if (query !== "") {
          var destino = document.querySelector('#H');
          if (destino) {
              var posicionY = destino.getBoundingClientRect().top + window.scrollY;
   window.scroll({top: posicionY - 20, behavior: 'smooth'});
          }
      }
      
      items.forEach(li => {
         var texto = li.textContent.toLowerCase();
  if (texto.includes(query)) {
       li.style.display = 'flex';
         } else {
    li.style.display = 'none';
         }
      });
    }

// ACCIÓN DEL ENTER: SIMULA EL CLIC O EJECUTA CHECK() SI NO HAY COINCIDENCIAS
       function AccionEnter() {
      var query = I.value.toLowerCase().trim();
      var items = document.querySelectorAll('#Lista li');
      var coincidencia = null;

      if (query !== "") {
          items.forEach(li => {
              var texto = li.textContent.toLowerCase();
              if (!coincidencia && li.style.display !== 'none' && texto.includes(query)) {
                  coincidencia = li;
              }
          });
      }

      if (coincidencia) {
          coincidencia.click();
          I.value = '';
      } else {
          Check();
          I.value = '';
      }
    }
</script>
