<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔑 UNIVERSAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet"/>
<style>
body {
    display: flex;
    flex-direction: column;    
    background: #000;
    align-items: center;        
}
.Contenedor {
    width: 90%;
    max-width: 500px;
    margin-top: 15vh;
}
#I {
    width: 80%;
    color: gold;
    height: 5vh;
    margin-left: 5vh;
    font-weight: bold;
    text-align: center;
    border-radius: 20px;
    background: #000918;
    border: 2px solid orange;
    font-family: 'Luckiest Guy', cursive;
    letter-spacing: 1.5px;
    transition: all 0.4s ease;
    box-shadow: 0px 0px 50px red;
}
#I::placeholder {
    color: #aaa;
}
#I:focus {
    outline: none;
}
#Results {
    width: 100%;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px; /* Espacio entre cada resultado */
    padding-bottom: 30px;
}
.Caja {
    background: #000918;
    border: 2px solid orange;
    border-radius: 15px;
    padding: 15px;
    text-decoration: none; /* Quita la línea de abajo de los enlaces */
    box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.4);
    transition: transform 0.3s;
    display: block;
    cursor: none;
}
.Caja:hover {
    transform: scale(1.05);
    border-color: blue;
}
.Caja-titulo {
    color: gold;
    font-family: 'Luckiest Guy', cursive;
    font-size: 22px;
    letter-spacing: 1px;
  &:hover {
      color: #4f3;
  }
}
.Caja-plataforma {
    color: #ccc;
    font-family: sans-serif;
    font-size: 13px;
    margin-top: 5px;
    font-weight: bold;
}
</style>
</head>
<body>
     <div class="Contenedor">
  <form onsubmit="event.preventDefault(); Check()">
       <input id="I" placeholder="Buscar..." type="text"/>       
  </form>

    <div id="Results"></div>
</div>

<script src="https://lamovie.github.io/Buscador/Buscador3.js"></script>

<script>
    function Check() {
      var query = I.value.toLowerCase().trim();
      
      if (query === "") return;
  Results.innerHTML = ""; 
      
      var EnLista = Lista3.filter((item) => {
   var nombreItem = (item.NAME || item.name || "").toLowerCase();
          return nombreItem.includes(query);
      });

    if (EnLista.length > 0) {
  EnLista.forEach((item) => {
var Titulo = item.NAME || item.name;
var Enlace = item.URL || item.url;
              
    if(Enlace !== "") {
        Results.innerHTML += `
 <a class="Caja" href="${Enlace}" target="_blank">
 <div class="Caja-titulo">${Titulo}</div>
 <div class="Caja-plataforma">⭐ (Solo Latino)</div>
                    </a>
                  `;
              }
          });
      }

      
 var Plataformas = [
    
    { name: "🧿 PelisFlix", url: "https://pelisflix1.link/search?s=" },
   
    { name: "🧋 PelisPedia", url: "https://pelispedia.mov/search?s=" },
  
    { name: "🎉 Gnula HD", url: "https://ww3.gnulahd.nu/?s=" },
   
    { name: "🎭 Solo Latino", url: "https://sololatino.net/buscar?q=" },
   
    { name: "🍿 Entre Peliculas y Series", url: "https://entrepeliculasyseries.nz/search?s=" }, 
    
    { name: "💮 CineCalidad RS", url: "https://www.cinecalidad.rs/?s=" },
    
    { name: "🌐 CineCalidad Pro", url: "https://ww2.cinecalidad.pro/?s=" },
   
    { name: "📺 PelisPlus HD", url: "https://www.pelisplushd.la/search?s=" },
   
    { name: "🌀 Poseidon HD", url: "https://www.poseidonhd2.co/search?q=" }
      ];

 
 Plataformas.forEach((plat) => {
     Results.innerHTML += `
 <a class="Caja" href="${plat.url}${I.value}" target="_blank">
                 <div class="Caja-titulo">Buscar: "${I.value}"</div>
                 <div class="Caja-plataforma">${plat.name}</div>
             </a>
      `;
  });

          I.value = '';
    }
</script> 
</body>
</html>
