body { display: none !important; }

<script>
if (window.self === window.top) {
      var ESCUDO = document.getElementById("Escudo-Seguridad");
        if (ESCUDO) ESCUDO.parentNode.removeChild(ESCUDO);

       document.documentElement.innerHTML = "<head></head><body style='background:#000; margin:0;'><h1 style='color:#f19; text-align:center; padding-top:40vh; font-family: sans-serif;'>⛔ Acceso Denegado: No Se Admiten SAPOS Aquí!.</h1></body>";

<style>
body {
    display: flex;
    flex-direction: column;    
    background: #000;
    align-items: center;        
}
.Contenedor {
    width: 90%;
    max-width: 500px;
    margin-top: 8vh;
}
#I {
    width: 80%;
    color: gold;
    height: 5vh;
    margin-left: 5vh;
    font-weight: bold;
    text-align: center;
    border-radius: 20px;
    background: #000918;
    border: 2px solid orange;
    font-family: 'Luckiest Guy', cursive;
    letter-spacing: 1.5px;
    transition: all 0.4s ease;
    box-shadow: 0px 0px 50px red;
}
#I::placeholder {
    color: #aaa;
}
#I:focus {
    outline: none;
}
#Results {
    width: 100%;
    height: 63vh;
    overflow: auto;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px; /* Espacio entre cada resultado */
    padding-bottom: 30px;
}
.Caja {
    background: #000918;
    border: 2px solid orange;
    border-radius: 15px;
    padding: 15px;
    text-decoration: none; /* Quita la línea de abajo de los enlaces */
    box-shadow: 0px 0px 15px rgba(255, 0, 0, 0.4);
    transition: transform 0.3s;
    display: block;
    cursor: none;
}
.Caja:hover {
    transform: scale(1.05);
    border-color: blue;
}
.Caja-titulo {
    color: gold;
    display: flex;
    justify-content: space-between;
    font-family: 'Luckiest Guy', cursive;
    font-size: 22px;
    letter-spacing: 1px;
  &:hover {
      color: #4f3;
  }
}
.Caja-plataforma {
    color: #ccc;

    font-size: 13px;
    margin-top: 5px;
    font-weight: bold;
}
#MG {
    width: 20%;
    border-radius: 30px;
}
h1 {
    color: gray;
    opacity: .3;
    font-family: 'Luckiest Guy', cursive;
}
</style>
</head>
